<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin><link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" crossorigin><link rel="prefetch" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" crossorigin><link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="preconnect" href="https://firestore.googleapis.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;700&family=Tiro+Bangla&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;700&family=Tiro+Bangla&display=swap"></noscript>
<title>সাহিত্য</title>
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<style>/* ===== সাহিত্য — স্টাইল (গল্পনীড় ডিজাইন অনুসরণে; অধ্যায় লাল) ===== */
:root{
  --bg:#f5f2ec;--card:#ffffff;--card2:#f0ece4;--text:#1b1917;--muted:#6f6a63;--line:#e1dbd0;
  --pur:#6a4fd1;--pur-soft:#d9cffb;--pur-on:#1d1240;
  --red:#c4262c;--red2:#a11d22;--on-red:#fff;
  --teal:#13857c;--pill:#dfe3f5;
  --ok-bg:#d9eed7;--ok-fg:#276a2a;--done-bg:#ece0c6;--done-fg:#6a4b12;
  --feat1:#1b2740;--feat2:#24365b;
  --shadow:0 1px 4px rgba(0,0,0,.12);
  --navh:74px;
  --rbg:#ffffff;--rtext:#1b1917;
}
html[data-theme=dark]{
  --bg:#121212;--card:#171717;--card2:#1f1f1f;--text:#f2f2f2;--muted:#a6a6a6;--line:#2b2b2b;
  --pur:#6f55d6;--pur-soft:#b9a2ff;--pur-on:#160c34;
  --red:#c4262c;--red2:#a11d22;
  --teal:#4fc3b8;--pill:#2c3050;
  --ok-bg:#16301a;--ok-fg:#9fdc9b;--done-bg:#3a2f14;--done-fg:#e8cf8f;
  --feat1:#14203a;--feat2:#1a2a4d;
  --shadow:0 2px 8px rgba(0,0,0,.5);
  --rbg:#121212;--rtext:#ececec;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);overflow-x:hidden;max-width:100%}
body{font-family:'Noto Sans Bengali','Hind Siliguri','Kalpurush','SolaimanLipi',system-ui,sans-serif;line-height:1.5;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
img{max-width:100%}
svg{display:block}
input,textarea,select{font:inherit;color:inherit}

/* ----- কাঠামো ----- */
.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--navh) + 20px + env(safe-area-inset-bottom))}
body.has-mini .app{padding-bottom:calc(var(--navh) + 88px + env(safe-area-inset-bottom))}
body.sub .app{padding-bottom:28px}
body.sub .nav,body.sub .mini{display:none!important}
body.reading{background:var(--rbg);color:var(--rtext)}
body.reading .app{padding-bottom:calc(120px + env(safe-area-inset-bottom));max-width:760px}
.page{padding:6px 14px 12px}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.errbox{margin:24px 16px;background:var(--card);border:1px solid var(--red);border-radius:14px;padding:18px;text-align:center}
.errbox p{margin:0 0 12px}

/* ----- হেডার ----- */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 10px 4px}
.hdr-row{display:flex;align-items:center;gap:2px;height:48px}
.hdr-title{flex:1;min-width:0;font-weight:700;font-size:18px;padding:0 4px}
.hdr-title span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:20px;padding-left:2px}
.brand img{width:34px;height:34px;border-radius:9px;object-fit:cover;background:#000;flex:0 0 auto}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--text);flex:0 0 auto;position:relative}
.icon-btn:active{background:var(--card2)}
.icon-btn svg{width:23px;height:23px}
.bell em{position:absolute;top:3px;right:1px;min-width:17px;height:17px;border-radius:9px;background:#e53935;color:#fff;font-style:normal;font-size:11px;line-height:17px;text-align:center;padding:0 4px}
.searchbar{display:flex;gap:8px;margin:4px 4px 6px}
.searchbar input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);padding:0 16px;outline:none}
.searchbar input:focus{border-color:var(--pur)}
.searchbar button{height:44px;padding:0 18px;border-radius:22px;background:var(--pur);color:#fff;font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 4px}
.tabs button{flex:1;padding:12px 4px;font-weight:600;color:var(--muted);position:relative}
.tabs button.on{color:var(--text)}
.tabs button.on::after{content:'';position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:2px;background:var(--pur-soft)}

/* ----- সাধারণ ----- */
.cover{aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--card2);flex:0 0 auto;position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.btn{background:var(--red);color:var(--on-red);border-radius:12px;padding:11px 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.pur{background:var(--pur);color:#fff}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.on{background:var(--card2);color:var(--text);border:1px solid var(--red)}
.btn svg{width:19px;height:19px}
.btn[disabled]{opacity:.45}
.btn.wa{background:#1fa855;color:#fff}
.link-btn{color:var(--pur-soft);font-weight:600;font-size:14px;padding:4px 2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{padding:8px 20px;border-radius:12px;background:var(--card2);font-size:15px;font-weight:600;border:1px solid var(--line)}
.chip.on{background:var(--pur-soft);color:var(--pur-on);border-color:var(--pur-soft)}
.pill{display:inline-block;padding:2px 10px;border-radius:7px;font-size:12px;border:1px solid var(--line);background:var(--card2);white-space:nowrap}
.pill.run{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.pill.done{background:var(--done-bg);color:var(--done-fg);border-color:transparent}
.pill.demo{background:#322a4a;color:#cfc3f2;border-color:transparent}
.ey{display:inline-grid;place-items:center}.ey svg{width:15px;height:15px}
.stats{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.stats .sep{width:1px;height:14px;background:var(--line)}
.stats span{display:inline-flex;align-items:center;gap:4px}
.star{color:#f5b301}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.sec-title h3{margin:0;font-size:20px;display:flex;align-items:center;gap:10px}
.sec-title h3::before{content:'';width:4px;height:22px;background:var(--red);border-radius:1px}
.more{font-weight:700;font-size:14px;color:var(--bg);background:var(--text);padding:6px 14px;border-radius:16px}
.nohdr.page{padding-top:16px}.tabs.nohdr{margin-top:10px}
.fltb{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:18px;background:var(--card2);color:var(--text);margin-left:auto}
.fltb svg{width:18px;height:18px}.fltb em{font-style:normal;color:var(--red)}
.fopt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 16px;border-radius:14px;background:var(--card2);color:var(--text);font-size:16px;font-weight:600;margin-bottom:10px;text-align:left}
.fopt.on{box-shadow:inset 0 0 0 2px var(--red)}.fopt svg{width:20px;height:20px;color:var(--red)}

/* ----- কার্ড (কার্ড ভিউ) ----- */
.books.list{display:flex;flex-direction:column;gap:12px}
.bcard{display:flex;gap:12px;padding:12px;border-radius:18px;background:var(--card);cursor:pointer;position:relative}
.bcard .cover{width:84px}
.bcard .bi{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px;justify-content:center}
.bcard .bt{font-weight:700;font-size:16px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bcard .ba{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .brow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.newb{position:absolute;top:0;left:0;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:8px 0 8px 0;z-index:1}
.books.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
.books.grid .bkc{width:100%;max-width:none;min-width:0;border-radius:18px}
.gcard{cursor:pointer;min-width:0}
.gcard .cover{width:100%}
.gcard .gt{font-size:14px;font-weight:600;margin-top:6px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gcard .ga{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gm{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:2px}
.hp{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.hp svg{width:15px;height:15px}
.rail{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail .bcard{flex:0 0 min(88%,360px);scroll-snap-align:start}
.rail.g3 .gcard{flex:0 0 31%;scroll-snap-align:start}

/* ----- হোম: নির্বাচিত ----- */
.rail.feat{margin:6px -14px 4px;padding:0 5%;gap:12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.rail.feat .fcard{flex:0 0 90%;scroll-snap-align:center;scroll-snap-stop:always;}
.fcard{position:relative;flex:0 0 100%;scroll-snap-align:start;display:flex;gap:16px;align-items:center;padding:16px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--feat1),var(--feat2));cursor:pointer;min-height:176px}
.fcard .cover{width:100px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.fcard .finfo{min-width:0;flex:1}
.fcard .ft{font-size:21px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fcard .fa{font-size:16px;margin-top:6px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.fbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 24px;border-radius:22px;background:var(--pur);color:#fff;font-weight:700;font-size:15px}
.fbtn svg{width:17px;height:17px}
.fbtn.alt{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}

/* ----- নিচের বার ও মিনি ----- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.nav [data-nav]{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--text);padding:0}
.nav .ico{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;color:var(--muted)}
.nav .ico svg{width:24px;height:24px}
.nav [data-nav].on .ico{background:var(--pill);color:var(--teal)}
.mini{position:fixed;left:12px;right:12px;bottom:calc(var(--navh) + 8px + env(safe-area-inset-bottom));z-index:29;max-width:696px;margin:0 auto;background:var(--card2);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 10px;overflow:hidden}
.mini[hidden]{display:none}
.mini-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--pur-soft)}
.mini-cover{width:40px;flex:0 0 auto;aspect-ratio:1/1;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--card)}
.mini-cover img{width:100%;height:100%;object-fit:cover;display:block}
.mini-txt{flex:1;min-width:0;cursor:pointer}
.mini-txt .mt{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-txt .ms{font-size:12px;color:var(--pur-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-pct{font-size:12px;color:var(--muted)}
.mini-x{width:32px;height:32px;display:grid;place-items:center;color:var(--teal);flex:0 0 auto}
.mini-x svg{width:18px;height:18px}

/* ----- নতুন পর্ব ট্যাব ----- */
.eps{display:flex;flex-direction:column;gap:12px}
.ep{display:flex;align-items:center;gap:8px;padding:14px 14px;border-radius:16px;background:var(--card)}
.ep .et{flex:1;min-width:0;text-align:left;cursor:pointer}
.ep .et b{display:block;font-size:16px;line-height:1.35}
.ep .em{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.ep .em span{display:inline-flex;align-items:center;gap:4px}
.freshb{border:1px solid var(--red);color:#ff8f94;background:rgba(196,38,44,.18);padding:0 8px;border-radius:5px;font-size:12px}
html:not([data-theme=dark]) .freshb{color:var(--red2)}
.ep .dlb{width:40px;height:40px;display:grid;place-items:center;color:var(--teal);flex:0 0 auto}
.ep .dlb svg{width:22px;height:22px}

/* ----- বইয়ের বিস্তারিত ----- */
.detail{display:flex;gap:14px;margin:8px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px}
.detail .cover{width:104px;flex:0 0 104px;border-radius:10px}
.detail .di{min-width:0;flex:1}
.detail h1{margin:0;font-size:21px;line-height:1.3}.detail h1 .lbl{font-weight:700}.detail .pr .dh{font-weight:700}.detail .pr{align-items:center;font-size:15px}
.detail .au{display:flex;align-items:center;gap:6px;color:var(--teal);margin-top:6px;font-size:15px}
.detail .au svg{width:15px;height:15px}
.detail .pr{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.bm{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;color:var(--text);text-align:left}
.bm svg{width:18px;height:18px;color:var(--teal)}
.bm.on svg{fill:var(--teal)}
.phd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.phd h3{margin:0}.pbt{display:flex;gap:10px}
.cbt{position:relative;width:46px;height:46px;border-radius:50%;background:var(--card2);color:var(--text);display:grid;place-items:center;flex:0 0 auto}.cbt svg{width:22px;height:22px}
.cbt.on{background:var(--red);color:var(--on-red)}.cbt.on svg{fill:currentColor}.cbt.busy{opacity:.6;pointer-events:none}
.cbg{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.btabs{display:flex;margin-top:14px;border-bottom:1.5px solid var(--line)}.btabs button{flex:1;padding:13px 6px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px}.btabs button.on{color:var(--text);border-bottom-color:var(--pur,#8b5cf6)}
.rvform{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}.rvform h3{margin:0 0 10px;font-size:17px}.rvform.done{text-align:center;font-weight:700;color:var(--teal)}
.rvst{display:flex;gap:6px;margin-bottom:10px}.rvst button{font-size:38px;line-height:1;color:var(--muted);opacity:.55;padding:2px 3px}.rvst button.on{color:#ffc107;opacity:1}
.rvform textarea{width:100%;box-sizing:border-box;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:15px;line-height:1.5;resize:vertical}
.rvcnt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:6px 2px 4px}
.rvh3{font-size:17px;margin:6px 2px 10px}.rvh3 small{color:#e0a100;font-size:14px;margin-left:6px}
.rvi{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.rvh{display:flex;align-items:center;gap:10px}.rvh .sav{width:40px;height:40px;flex:0 0 auto}.rvn{flex:1;min-width:0}.rvn b{display:block;font-size:15px;color:var(--text)}.rvh small{color:var(--muted);font-size:12px;flex:0 0 auto}
.rvi p{margin:8px 0 0;line-height:1.6;font-size:15px;color:var(--text);word-break:break-word}
.stz i{font-style:normal;color:var(--line);font-size:15px}.stz i.on{color:#ffc107}
.cmr{margin-top:8px;padding:8px 10px;border-left:3px solid var(--red);background:var(--card);border-radius:8px}.cmr small{color:var(--muted);font-size:12px}.cmr .lk{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:9px;margin-right:6px}.cmr p{margin:4px 0 0!important}
.bstats{display:flex;gap:24px;margin-top:12px}.bstats small{display:block;color:var(--muted);font-size:12.5px}.bstats b{font-size:17px;font-weight:700}
.icon-btn.bmh svg{width:22px;height:22px}.icon-btn.bmh.on{color:var(--teal)}.icon-btn.bmh.on svg{fill:var(--teal)}
.reacts{display:flex;gap:8px;margin:10px 0 4px}
.reacts .btn{padding:8px 16px;font-size:14px}
.startrow{display:flex;gap:10px;margin:14px 0 6px}
.startrow .btn{flex:1;font-size:16px;padding:13px 10px}
.startrow .btn.pur{flex:1;background:#e84d73!important;color:#fff!important;border:0}
.startrow .dlall{border:1.5px solid #7a2a36!important;background:transparent!important;color:var(--text)!important}.startrow .dlall.fin,.startrow .dlall.busy{color:#fff!important}
.bdesc{margin-top:8px;font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.desc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0;line-height:1.75;font-size:14.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
.panel h3{margin:2px 0 12px;font-size:17px}
.panel .ch{transition:background .25s;background:var(--chbar,#b71c1c);display:flex;align-items:center;gap:4px;width:100%;text-align:left;color:#fff;border-radius:12px;padding:2px 6px 2px 0;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.ch .chm{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;color:inherit;padding:8px 6px 8px 12px;background:none}
.ch .chn{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:rgba(0,0,0,.28);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.ch .cht{flex:1;min-width:0}
.ch .cht b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .cht small{display:block;margin-top:2px;font-size:12px;opacity:.92}
.ch .cht small svg{width:15px;height:15px;vertical-align:-2px;margin-right:3px}

.cmemo{display:none;gap:4px;justify-content:space-between;padding:2px 2px 8px;overflow-x:auto}.cmc:focus-within .cmemo{display:flex}.cmemo button{font-size:26px;padding:2px 6px}
.cmrow{display:flex;align-items:flex-end;gap:10px}.cmrow .sav{width:38px;height:38px;border-radius:50%;background:var(--pur);color:#fff;display:grid;place-items:center;font-weight:700;flex:0 0 auto;margin-bottom:3px}
.cmrow textarea{flex:1;min-height:44px;max-height:120px;resize:none;border:0;background:#2e2e32;color:#f2f2f2;border-radius:22px;padding:12px 16px;font:inherit;font-size:15.5px;outline:0;line-height:1.4}

.cmst{display:flex;gap:6px;justify-content:center;padding:0 0 8px}.cmst button{font-size:30px;color:#555;line-height:1;padding:0 3px}.cmst button.on{color:#f5b301}
.cmdone{text-align:center;color:#2fd4a0;font-weight:700;padding:8px 16px 4px}.cmh3{margin:10px 0 6px;font-size:16px;display:flex;gap:10px;align-items:center}.cmh3 small{color:#f5b301;font-size:14px}

@keyframes sh-up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:#888;margin:2px auto 14px}
.sheet h3{margin:0 0 12px;font-size:21px;display:flex;align-items:center;gap:10px}

/* ----- প্রোফাইল ----- */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}

.chart{height:190px;display:flex;align-items:flex-end;justify-content:space-around;padding:8px 0 0}

.chart .bar{width:20px;border-radius:10px;background:var(--card2);border:1px solid var(--line);min-height:14px}

.mrow .mt{flex:1;min-width:0}.mrow .mt small{display:block;font-size:12px;color:var(--muted);margin-top:1px}

/* ----- বের হওয়ার সতর্কবার্তা ----- */
.dlg-wrap{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.dlg-wrap[hidden]{display:none}
.dlg{width:min(100%,340px);background:var(--card);color:var(--text);border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.5);border:1px solid var(--line)}

/* ----- স্প্ল্যাশ ও টোস্ট ----- */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .3s}
.splash.hide{opacity:0;pointer-events:none}
.splash-wrap{position:relative;display:grid;place-items:center}
.splash-logo{width:128px;height:128px;border-radius:28px;background:#000;object-fit:cover;box-shadow:0 4px 18px rgba(0,0,0,.5);animation:sp-pop .7s cubic-bezier(.2,.9,.3,1.2) both}
.splash-ring{position:absolute;width:128px;height:128px;border-radius:32px;border:3px solid #c4262c;opacity:0;animation:sp-ring 1.6s .5s ease-out infinite;pointer-events:none}
.splash-name{font-size:30px;font-weight:700;margin-top:14px;animation:sp-up .6s .35s ease both}
.splash-tag{font-size:15px;color:var(--muted);animation:sp-up .6s .55s ease both}
.splash-spin{margin-top:26px;animation:sp-up .5s .75s ease both}
.splash-spin i{display:block;width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#b9a2ff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sp-pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes sp-up{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes sp-ring{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
@media (prefers-reduced-motion:reduce){.splash-logo,.splash-name,.splash-tag,.splash-spin,.splash-ring,.splash-spin i{animation:none}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#f2f2f2;color:#111;padding:9px 18px;border-radius:20px;font-size:14px;z-index:130;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}

.toast.show{opacity:1}
.xmsg{position:fixed;left:50%;bottom:84px;transform:translate(-50%,16px);width:calc(100% - 32px);max-width:420px;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:#2f2f2f;color:#fff;padding:14px 18px;border-radius:26px;font-size:15px;font-weight:600;line-height:1.45;box-shadow:0 6px 22px rgba(0,0,0,.4);z-index:135;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,transform .25s,visibility .25s}

.rchrome{position:fixed;top:0;left:0;right:0;z-index:25;max-width:760px;margin:0 auto;background:var(--rbg);color:var(--rtext);transition:transform .28s,opacity .28s}

.rtop .mid small{font-size:13px;font-weight:500;opacity:.8}

.rtop .abtn{background:var(--pur-soft);color:var(--pur-on);border-radius:8px;font-weight:700;font-size:20px;width:34px!important;height:34px!important;margin:0 6px}

.rmark.fin{background:#2e7d32}
.reader{text-align:left}.reader .rmark{display:block;width:max-content;margin:0 auto 6px}

body.chrome-off .rfoot,body.chrome-off .spk-bar{transform:translateY(130%);opacity:0;pointer-events:none;visibility:hidden;transition:transform .28s,opacity .28s,visibility 0s .28s}
.rfoot,.spk-bar{transition:transform .28s,opacity .28s}
.rbtns button.on{color:var(--red)}
.rpct{font-size:12.5px;text-align:center;margin:5px 0 4px;opacity:.85}
.lplayer{display:none;flex-direction:column;align-items:center;padding:142px 26px 30px;text-align:center}
body.lmode .lplayer{display:flex}

.splash{overflow:hidden}.splash-tag{display:block;text-align:center;font-weight:600;max-width:320px;line-height:1.6;color:var(--text);margin-top:6px}
.splash::before{content:'';position:absolute;top:-130px;right:-130px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(196,38,44,.38),transparent 70%);animation:glowp 4s ease-in-out infinite}
.splash::after{content:'';position:absolute;left:7%;top:17%;width:6px;height:6px;border-radius:50%;background:#c4506a;box-shadow:78vw 40vh 0 #c4506a,38vw 74vh 0 rgba(196,80,106,.7),86vw 9vh 0 rgba(196,80,106,.6),-2vw 52vh 0 rgba(196,80,106,.8);animation:dotf 6s ease-in-out infinite}
@keyframes glowp{50%{transform:scale(1.18);opacity:.7}}@keyframes dotf{50%{transform:translateY(-14px)}}
.splash-logo{border-radius:30px;padding:0}.splash-quote{font-style:normal;font-weight:600;color:var(--text);max-width:320px;margin-top:12px;font-size:14.5px}
.arc{width:46px;height:46px;animation:arcrot 1.4s linear infinite}.arc circle{fill:none;stroke:#f4a3b8;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 120;animation:arcd 1.4s ease-in-out infinite}
@keyframes arcrot{to{transform:rotate(360deg)}}@keyframes arcd{0%{stroke-dasharray:1 120;stroke-dashoffset:0}50%{stroke-dasharray:72 120;stroke-dashoffset:-18}100%{stroke-dasharray:72 120;stroke-dashoffset:-112}}
.splash-load{font-weight:600;margin-top:12px;animation:sp-up .5s .9s ease both}.splash-ver{font-size:12px;color:var(--muted);margin-top:4px;animation:sp-up .5s 1s ease both}

html:not([data-theme=dark]) .skb,html:not([data-theme=dark]) .skrow i,html:not([data-theme=dark]) .sklist b{background:linear-gradient(110deg,#e6dfd6 35%,#fff 50%,#e6dfd6 65%);background-size:260% 100%}

/* ===== লাইক / ডিসলাইক — চালু অবস্থা স্পষ্ট ===== */

/* ===== অফলাইন স্ক্রিন ===== */

.bkc .bkst svg{width:16px;height:16px}
.bkc .bkn{position:absolute;left:8px;bottom:8px;top:auto;right:auto;z-index:2;display:inline-flex;align-items:center;gap:4px;background:#d97706;color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:10px;line-height:1.3;white-space:nowrap}
.bkc .bkn svg{width:14px;height:14px}
.bkc .bka{top:auto;left:auto;right:8px;bottom:8px}
.bkc .bkt{position:static;left:auto;right:auto;bottom:auto;color:var(--text);padding:7px 2px 0}
.bkc .bkt b{display:block;font-size:14.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:none}
.bkc .bkt span{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:12.5px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:none}
.bkc .bkt .vtick{margin-left:0;width:14px;height:14px;flex:none}
.rail:not(.feat) .bkc:active,.books.grid .bkc:active{transform:scale(.97)}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--red);color:#fff;border-radius:14px;padding:13px 14px;font-weight:700;font-size:16px}
.bigbtn svg{width:20px;height:20px;flex:none}
.hdr-row .quizb svg{width:22px;height:22px}
.scopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-top:8px;color:var(--text)}
.scopt .si{width:40px;height:40px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.scopt .si svg{width:22px;height:22px}
.scopt b{display:block;font-size:15px}.scopt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.5}
.scnote{font-size:12.5px;color:var(--muted);line-height:1.7;margin:12px 2px 2px}
.quizpill{margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:16px;background:var(--red);color:#fff;font-size:13px;font-weight:700;line-height:1.2}.quizpill svg{width:16px;height:16px}
main.page.wp{padding-bottom:calc(130px + env(safe-area-inset-bottom))}
main.page.wp .wbtn.out{width:100%;margin:14px 0 0;padding:12px 16px;color:#ff6b6b;border:1.5px solid rgba(255,107,107,.5);font-weight:700}
</style>

function paragraphs(book, n) {
  // প্রতিটি ডেমো অধ্যায়ে নমুনা বাক্যের আলাদা সমন্বয়; এটি পূর্ণ বাস্তব উপন্যাসের লেখা নয়
  const s = book.s; const out = [];
  for (let p = 0; p < 4; p++) {
    const a = s[(n * 2 + p * 3) % s.length];
    const b = s[(n * 2 + p * 3 + 1) % s.length];
    const c = s[(n + p * 5 + 2) % s.length];

  return out.map(x => x.trim());
}

// ডেমো অডিও: শুধু প্লেয়ার পরীক্ষার জন্য একটি ছোট সুর (আসল উপন্যাসের অডিও নয়)
function toneWav(notes, perNote) {
  const rate = 8000; const per = Math.floor(rate * perNote); const n = per * notes.length;
  const bytes = new Uint8Array(44 + n); const dv = new DataView(bytes.buffer);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) bytes[o + i] = t.charCodeAt(i); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
  dv.setUint16(22, 1, true); dv.setUint32(24, rate, true); dv.setUint32(28, rate, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
  w(36, 'data'); dv.setUint32(40, n, true);
  for (let k = 0; k < notes.length; k++) for (let i = 0; i < per; i++) {
    const env = Math.min(1, i / 200, (per - i) / 400);
    bytes[44 + k * per + i] = 128 + Math.round(70 * env * Math.sin(2 * Math.PI * notes[k] * i / rate));
  }
  const T = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'; let o = '';
  for (let i = 0; i < bytes.length; i += 3) {
    const a = bytes[i], b = bytes[i + 1], c = bytes[i + 2]; const x = (a << 16) | ((b || 0) << 8) | (c || 0);
    o += T[(x >> 18) & 63] + T[(x >> 12) & 63] + (i + 1 < bytes.length ? T[(x >> 6) & 63] : '=') + (i + 2 < bytes.length ? T[x & 63] : '=');
  }
  return 'data:audio/wav;base64,' + o;
}

/* প্রকাশিত বইয়ের পর্ব-তালিকা (chs / audio) পর্ব বদলালে বা মুছলে মিলিয়ে রাখা */
async function wSyncBook(E, mode, f) {
  if (!E.pub) return;
  try {
    const ref = WR.fs.doc('books/' + E.bid), d = await ref.get(); if (!d.exists) return; const x = d.data(), up = {};
    const hit = (e) => String(e.id) === String(E.cid) || (e.id == null && e.n != null && +e.n === +E.oldN);
    if (Array.isArray(x.chs) && x.chs.some(hit)) up.chs = mode === 'del' ? x.chs.filter((e) => !hit(e)) : x.chs.map((e) => hit(e) ? Object.assign({}, e, { n: f.n, t: f.title, sc: f.sc || 0 }) : e);
    if (Array.isArray(x.audio) && x.audio.some(hit)) up.audio = mode === 'del' ? x.audio.filter((e) => !hit(e)) : x.audio.map((e) => hit(e) ? Object.assign({}, e, { n: f.n, title: f.title }, f.audio ? { url: f.audio } : {}) : e);
    if (Object.keys(up).length) await ref.update(up);
  } catch (e) { toast('বইয়ের পর্ব-তালিকা হালনাগাদ করা যায়নি — অ্যাডমিনকে জানান'); }
}

function noticePopup() {
  try {
    if (document.querySelector('.npop') || document.querySelector('#splash')) return;
    const list = (typeof db !== 'undefined' && db && db.notices || []).filter((x) => x && !x.demo && x.createdAt);
    let seen = store.get('jp_popseen', 0);
    if (!seen) { store.set('jp_popseen', Date.now()); return; }
    const fresh = list.filter((x) => Date.parse(x.createdAt) > seen).sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));
    if (!fresh.length) return;
    const n = fresh[0], bid = n.bookId ? String(n.bookId) : '';
    const o = document.createElement('div'); o.className = 'npop'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true');
    o.innerHTML = '<div class="npc"><div class="npi">🔔</div><div class="npt">' + esc(n.type || 'নোটিফিকেশন') + '</div><h2>' + esc(n.title || '') + '</h2><p>' + esc(n.body || '') + '</p>' +
      '<div class="npb">' + (bid ? '<button class="npgo" type="button">পড়ুন</button>' : '') + '<button class="npok" type="button">ঠিক আছে</button></div></div>';
    const done = () => { store.set('jp_popseen', Date.parse(n.createdAt) || Date.now()); o.classList.add('out'); setTimeout(() => o.remove(), 250); };
    o.querySelector('.npok').onclick = done;
    const g = o.querySelector('.npgo'); if (g) g.onclick = () => { done(); nav('/book/' + enc(bid)); };
    document.body.appendChild(o);
  } catch (e) { /* ignore */ }
}

function idb() {
  return new Promise((res, rej) => {
    try { const r = indexedDB.open('jp_audio', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => { const tx = db.transaction('f', mode); const rq = fn(tx.objectStore('f')); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
}
const idbPut = (k, v) => idbDo('readwrite', (st) => st.put(v, k));
const idbGet = (k) => idbDo('readonly', (st) => st.get(k));
const idbDel = (k) => idbDo('readwrite', (st) => st.delete(k));
